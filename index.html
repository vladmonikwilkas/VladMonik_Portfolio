<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Три блока</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            overflow-y: hidden;
        }

        body {
            overflow-x: hidden;
        }

        .block {
            height: 100vh;
            width: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .block img,
        .block video {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            /* Центрируем картинку, чтобы на мобилках не обрезало самое важное */
        }

        .content {
            position: absolute;
            bottom: 15%;
            /* Опускаем блок вниз */
            z-index: 1;
            color: white;
            text-align: center;
            padding: 30px 40px;
            background: rgba(0, 0, 0, 0.7);
            /* Делаем фон чуть темнее для контраста */
            border-radius: 15px;
            max-width: 90%;
            width: fit-content;
        }

        .content h1 {
            font-size: 3rem;
            margin-bottom: 15px;
            font-family: Arial, sans-serif;
        }

        .content p {
            font-size: 2.5rem;
            /* Сильно увеличиваем шрифт */
            font-family: Arial, sans-serif;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9);
            /* Добавляем тень для пущей читаемости */
            font-family: Arial, sans-serif;
        }

        /* Блок 1 - светлый фон */
        .block-1 {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        /* Блок 2 - тёмный фон */
        .block-2 {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        /* Блок 3 - видео */
        .block-3 {
            background: #000;
        }

        .video-loading {
            position: absolute;
            inset: 0;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 24px;
            color: white;
            text-align: center;
            background: rgba(0, 0, 0, 0.58);
            pointer-events: none;
        }

        .video-loading[hidden] {
            display: none;
        }

        .video-spinner {
            width: 64px;
            height: 64px;
            border: 6px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: video-spin 0.85s linear infinite;
        }

        @keyframes video-spin {
            to {
                transform: rotate(360deg);
            }
        }

        #videoLoadingText {
            max-width: min(90vw, 520px);
            font: 600 1.2rem/1.5 Arial, sans-serif;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.9);
        }

        .video-loading.is-error .video-spinner {
            display: none;
        }

        .scroll-btn {
            position: absolute;
            bottom: 40px;
            /* Было 30px, немного подняли базово */
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        /* Медиа-запросы для мобильных устройств (чтобы кнопки и текст не уезжали за экран) */
        @media (max-width: 768px) {
            .scroll-btn {
                bottom: 100px;
                /* Подняли кнопку значительно выше, чтобы точно влезла на всех телефонах (Safari, Chrome и т.д.) */
            }

            .content p {
                font-size: 1.8rem;
            }

            .content {
                bottom: 25%;
                /* Немного приподняли и текст, чтобы он не наезжал на поднятую кнопку */
                padding: 20px;
            }
        }

        .scroll-btn:hover {
            background: rgba(255, 255, 255, 0.5);
            transform: translateX(-50%) scale(1.1);
        }

        #block3 .scroll-btn {
            opacity: 0.5;
        }

        #block3 .scroll-btn:hover,
        #block3 .scroll-btn:focus-visible {
            opacity: 0.82;
        }

        #playBtn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 3;
            padding: 22px 42px;
            max-width: min(88vw, 560px);
            border: 3px solid white;
            border-radius: 16px;
            background: linear-gradient(135deg, #fff34a, #ffb800);
            color: #171000;
            font: 800 1.7rem/1.25 Arial, sans-serif;
            text-align: center;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.35);
            box-shadow: 0 0 14px 3px rgba(255, 220, 0, 0.75), 0 0 34px 8px rgba(255, 184, 0, 0.45);
            cursor: pointer;
            animation: portfolio-cta-glow 1.6s ease-in-out infinite;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        #playBtn:hover,
        #playBtn:focus-visible {
            animation-play-state: paused;
            transform: translate(-50%, -50%) scale(1.04);
            background: linear-gradient(135deg, #fff875, #ffca35);
        }

        #playBtn:focus-visible {
            outline: 3px solid white;
            outline-offset: 6px;
        }

        @keyframes portfolio-cta-glow {
            0%,
            100% {
                box-shadow: 0 0 14px 3px rgba(255, 220, 0, 0.75), 0 0 34px 8px rgba(255, 184, 0, 0.45);
            }

            50% {
                box-shadow: 0 0 22px 7px rgba(255, 235, 60, 0.95), 0 0 48px 15px rgba(255, 184, 0, 0.65);
            }
        }

        @media (max-width: 768px) {
            #playBtn {
                width: min(88vw, 480px);
                padding: 20px 24px;
                font-size: clamp(1.25rem, 6vw, 1.7rem);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            #playBtn {
                animation: none;
            }
        }

        .scroll-btn::after {
            content: "↓";
            color: white;
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <!-- Блок 1: Текст + картинка -->
    <section class="block block-1" id="block1">
        <img src="" alt="Фон 1" id="img1">
        <div class="content">
            <h1 id="title1" style="display:none;"></h1>
            <p>Ваш текст здесь</p>
        </div>
        <button class="scroll-btn" onclick="scrollToBlock(2)"></button>
    </section>

    <!-- Блок 2: Текст + картинка -->
    <section class="block block-2" id="block2">
        <img src="" alt="Фон 2" id="img2">
        <div class="content">
            <h1 id="title2" style="display:none;"></h1>
            <p>Ваш текст здесь</p>
        </div>
        <button class="scroll-btn" onclick="scrollToBlock(3)"></button>
    </section>

    <!-- Блок 3: Авто-видео -->
    <section class="block block-3" id="block3">
        <video id="video3" loop playsinline>
            <source src="" type="video/mp4" id="videoSource">
            Ваш браузер не поддерживает видео.
        </video>
        <div id="videoLoading" class="video-loading" role="status" aria-live="polite" hidden>
            <span class="video-spinner" aria-hidden="true"></span>
            <p id="videoLoadingText">Загружаем видео… Медленное соединение может занять немного времени.</p>
        </div>
        <!-- Кнопка теперь ведет на 4-й блок (визуально вниз) -->
        <button class="scroll-btn" onclick="scrollToBlock(4)"></button>
        <button id="playBtn">посмотреть портфолио</button>
    </section>

    <!-- Блок 4: Технический клон Блока 2 для иллюзии бесконечности -->
    <section class="block block-2" id="block4">
        <img src="" alt="Фон 4" id="img4">
        <div class="content">
            <h1 id="title4">Портфолио</h1>
            <p id="text4">Листайте дальше...</p>
        </div>
        <button class="scroll-btn" onclick="scrollToBlock(3)"></button>
    </section>

    <script src="phrases.js"></script>
    <script>
        const video = document.getElementById('video3');
        const playBtn = document.getElementById('playBtn');
        const videoLoading = document.getElementById('videoLoading');
        const videoLoadingText = document.getElementById('videoLoadingText');
        const playButtonLabel = playBtn.textContent.trim();
        let currentBlock = 1;
        let videoRequested = false;

        function showVideoLoading() {
            videoLoading.classList.remove('is-error');
            videoLoadingText.textContent = 'Загружаем видео… Медленное соединение может занять немного времени.';
            videoLoading.hidden = false;
        }

        function showVideoError() {
            if (!videoRequested) return;

            videoLoading.classList.add('is-error');
            videoLoadingText.textContent = 'Не удалось загрузить видео. Проверь соединение и попробуй ещё раз.';
            videoLoading.hidden = false;
            playBtn.disabled = false;
            playBtn.textContent = 'Повторить загрузку';
            playBtn.style.display = 'block';
        }

        function resetVideoUI() {
            videoRequested = false;
            videoLoading.hidden = true;
            videoLoading.classList.remove('is-error');
            playBtn.disabled = false;
            playBtn.textContent = playButtonLabel;
        }

        function startVideo() {
            videoRequested = true;
            showVideoLoading();
            playBtn.disabled = true;
            playBtn.style.display = 'none';

            if (video.error) {
                video.load();
            }

            const playPromise = video.play();
            if (playPromise && typeof playPromise.catch === 'function') {
                playPromise.catch(showVideoError);
            }
        }

        // Логика картинок и текстов
        let imgIndex = 0; // Теперь стартуем с 0 индекса из массива loopImages
        let textIndex = 0;

        // Инициализация при загрузке: берем ВСЕ данные из phrases.js
        if (typeof initialPhrases !== 'undefined') {
            document.querySelector('#block1 p').innerText = initialPhrases.block1;
            document.querySelector('#block2 p').innerText = initialPhrases.block2;

            // Устанавливаем стартовые картинки
            document.getElementById('img1').src = startImages.block1;
            document.getElementById('img2').src = startImages.block2;
            document.getElementById('img4').src = startImages.block2; // Блок 4 это изначально клон Блока 2

            // Устанавливаем видео
            document.getElementById('videoSource').src = videoFileName;
            video.load(); // Важно! Перезагружаем видео, чтобы браузер подхватил новый src
        }

        // Блокируем скролл колёсиком, тачем и клавиатурой
        window.addEventListener('wheel', (e) => e.preventDefault(), { passive: false });
        window.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
        window.addEventListener('keydown', (e) => {
            if (['ArrowUp', 'ArrowDown', 'PageUp', 'PageDown', 'Home', 'End'].includes(e.key)) {
                e.preventDefault();
            }
        });

        function scrollToBlock(blockNumber) {
            // Логика для бесконечного цикла (переход 3 -> 4)
            if (currentBlock === 3 && blockNumber === 4) {
                resetVideoUI();
                video.pause();
                video.currentTime = 0;
                playBtn.style.display = 'block'; // Возвращаем кнопку Play

                // 1. Скроллим вниз к 4-му блоку (плавно)
                document.getElementById('block4').scrollIntoView({ behavior: 'smooth' });

                // 2. Ждем окончания анимации (800мс), затем телепортируем на Блок 2
                setTimeout(() => {
                    // Синхронизируем Блок 2 с Блоком 4 (на котором мы сейчас)
                    // Блок 4 уже содержит новую картинку, которую мы поставили на шаге 2->3
                    const currentImgSrc = document.querySelector('#block4 img').src;
                    document.querySelector('#block2 img').src = currentImgSrc;

                    // Синхронизируем текст (копируем с 4-го на 2-й)
                    const title2 = document.querySelector('#block2 h1');
                    const title4 = document.querySelector('#block4 h1');
                    title2.innerText = title4.innerText;
                    title2.style.display = 'block';
                    document.querySelector('#block2 p').innerText = document.querySelector('#block4 p').innerText;

                    // Мгновенный прыжок назад на Блок 2 (без анимации)
                    document.getElementById('block2').scrollIntoView({ behavior: 'auto' });
                    currentBlock = 2;
                }, 800);

                return; // Прерываем функцию, так как мы обработали переход вручную
            }

            // При переходе 2→3 показываем кнопку
            if (currentBlock === 2 && blockNumber === 3) {
                resetVideoUI();
                video.currentTime = 0;
                video.pause();
                playBtn.style.display = 'block';

                // ЗАРАНЕЕ готовим следующую картинку на 4-м блоке из массива loopImages
                imgIndex = (imgIndex + 1) % loopImages.length;
                document.querySelector('#block4 img').src = loopImages[imgIndex];
                console.log('Загружаю картинку:', loopImages[imgIndex]); // Для проверки (F12 -> Console)

                // ЗАРАНЕЕ готовим следующий текст на 4-м блоке из phrases.js
                if (typeof loopPhrases !== 'undefined') {
                    const phrase = loopPhrases[textIndex % loopPhrases.length];
                    document.querySelector('#block4 h1').innerText = phrase.title;
                    document.querySelector('#block4 p').innerText = phrase.text;
                    textIndex++;
                }
            }

            // Скроллим к нужному блоку
            const block = document.getElementById('block' + blockNumber);
            block.scrollIntoView({ behavior: 'smooth' });

            currentBlock = blockNumber;
        }

        playBtn.addEventListener('click', () => {
            video.currentTime = 0;
            startVideo();
        });

        video.addEventListener('play', () => {
            playBtn.style.display = 'none';
        });

        video.addEventListener('waiting', () => {
            if (videoRequested) showVideoLoading();
        });

        video.addEventListener('stalled', () => {
            if (videoRequested) showVideoLoading();
        });

        video.addEventListener('playing', () => {
            if (!videoRequested) return;
            videoLoading.hidden = true;
            videoLoading.classList.remove('is-error');
            playBtn.style.display = 'none';
        });

        video.addEventListener('error', showVideoError);
    </script>
</body>

</html>
